<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Timer | Scientific Analysis</title>
    <style>
        /* CSS Style - Scientific Blue Aesthetic */
        :root {
            --bg-color: #e3f2fd; /* Light Scientific Blue */
            --card-bg: #ffffff;
            --accent-blue: #1976d2; /* Primary Lab Blue */
            --text-main: #263238;
            --btn-start: #81c784; /* Success Green */
            --btn-pause: #ffd54f; /* Caution Yellow */
            --btn-reset: #cfd8dc; /* Neutral Grey */
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(25, 118, 210, 0.15);
            text-align: center;
            width: 320px;
            border-top: 8px solid var(--accent-blue);
        }

        #lab-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace; /* Monospace for scientific feel */
            font-size: 54px;
            font-weight: bold;
            margin: 10px 0 30px 0;
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            border: 1px solid rgba(0,0,0,0.1);
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s;
            color: var(--text-main);
        }

        button:hover {
            filter: brightness(0.9);
        }

        button:active {
            transform: translateY(2px);
        }

        #start-btn { background-color: var(--btn-start); }
        #pause-btn { background-color: var(--btn-pause); }
        #reset-btn { background-color: var(--btn-reset); }

        .status-text {
            margin-top: 25px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            color: #546e7a;
        }
    </style>
</head>
<body><a href="https://S80263.github.io" style="position:absolute; top:20px; left:20px;">← Back to Portfolio</a>

    <div class="container">
        <div id="lab-icon">🧪</div>
        <div class="timer-display" id="timer">15:00</div>
        
        <div class="controls">
            <button id="start-btn">Start Run</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="status-text" id="status">Standby: Ready for Analysis</div>
    </div>

    <audio id="finish-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        /* JavaScript Logic */
        const DEFAULT_TIME = 15 * 60; // 15 Minutes
        let timeLeft = DEFAULT_TIME;
        let timerId = null;

        const labIcon = document.getElementById('lab-icon');
        const timerDisplay = document.getElementById('timer');
        const statusText = document.getElementById('status');
        const finishSound = document.getElementById('finish-sound');

        const labStates = {
            IDLE: { emoji: '🧪', text: 'Standby: Ready for Analysis' },
            RUNNING: { emoji: '🔬', text: 'Status: Analyzing Sample...' },
            COMPLETE: { emoji: '✅', text: 'Result: Process Finished' }
        };

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId !== null) return;
            
            labIcon.textContent = labStates.RUNNING.emoji;
            statusText.textContent = labStates.RUNNING.text;

            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            statusText.textContent = "Status: Protocol Paused";
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = DEFAULT_TIME;
            updateDisplay();
            labIcon.textContent = labStates.IDLE.emoji;
            statusText.textContent = labStates.IDLE.text;
        }

        function finishTimer() {
            labIcon.textContent = labStates.COMPLETE.emoji;
            statusText.textContent = labStates.COMPLETE.text;
            finishSound.play();
        }

        // Event Listeners
        document.getElementById('start-btn').addEventListener('click', startTimer);
        document.getElementById('pause-btn').addEventListener('click', pauseTimer);
        document.getElementById('reset-btn').addEventListener('click', resetTimer);

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
